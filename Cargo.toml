[package]
name = "a"
version = "0.0.3"
edition = "2024"

[dependencies]
chrono = "0.4.45"
encrypt = "0.1.3"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
